[package]
name = "dotagent-dash"
version = "0.1.0"
edition = "2021"
description = "Fleet dashboard for dotagent-inhabited repos"

[[bin]]
name = "dotagent-dash"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
walkdir = "2"
nix = { version = "0.29", features = ["signal"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
